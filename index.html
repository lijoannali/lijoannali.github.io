<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joanna Li</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      color: #505050;
      font-family: Noto, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    .page {
      max-width: 960px;
      margin: 80px auto;
      padding: 0 28px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 48px;
      margin-bottom: 80px;
    }

    a {
      color: #155bd7;
    }

    nav a {
      color: #172536;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav a[aria-current="page"] {
      color: #155bd7;
    }

    a:hover {
      text-decoration: underline;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    h1 {
      margin: 0 0 24px;
      font-family: Georgia, serif;
      font-size: 48px;
      font-weight: normal;
      line-height: 1.15;
    }

    .intro {
      display: flex;
      align-items: flex-start;
      gap: 36px;
    }

    .portrait {
      display: block;
      width: 220px;
      max-width: 100%;
      height: auto;
      flex-shrink: 0;
    }

    .bio {
      flex: 1;
      min-width: 0;
    }

    .bio p {
      margin: 0 0 18px;
    }

    .bio .contact {
      margin-top: 30px;
      font-size: 16px;
    }

    /* 1. Centered navigation, left-aligned content */
    .layout-1 nav {
      justify-content: center;
    }

    /* 4. Everything left aligned */
    .layout-4 nav {
      justify-content: flex-start;
    }

    /* 5. Right navigation and portrait, left text */
    .layout-5 nav {
      justify-content: flex-end;
    }

    .layout-5 .intro {
      flex-direction: row-reverse;
    }

    /* Keep every layout comfortable on phones */
    @media (max-width: 640px) {
    .page {
      margin: 0 auto;
      padding: 28px 24px 36px;
    }

    .site-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 20px;
      margin-bottom: 48px;
    }

    .site-header nav {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      margin: 0;
      font-size: 16px;
    }

    .site-header nav a {
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    .site-header h1 {
      margin: 0;
      text-align: right;
      font-size: clamp(30px, 6vw, 40px);
    }

    .intro {
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .portrait {
      width: 200px;
      height: 240px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
    }

    .bio {
      width: 100%;
      max-width: 440px;
      text-align: left;
    }

    .bio .contact {
      margin-top: 28px;
      text-align: center;
    }
  }
  </style>
</head>
<body>
<div class="page layout-1">
<header class="site-header">
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">About</a>
      <a href="work.html">Work</a>
      <a href="now.html">Now</a>
      <a href="reading.html">Reading</a>
    </nav>

    <h1>Joanna Li</h1>
  </header>
  <main>
    <div class="intro">
      <img
        src="images/portrait.jpg"
        alt="A picture of Joanna Li wearing a shirt with black and white spirals and smiling. The sky behind her is blue!"
        class="portrait"
      >

      <div class="bio">
        <p>
          I am Joanna Li, and I study electrical and computer
          engineering at Rice University.
        </p>

        <p>
          Chances are, you’ll find me sketching, cooking new
          recipes, and visiting unexpected locations…
        </p>

        <p class="contact">
          email | github | linkedin
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
